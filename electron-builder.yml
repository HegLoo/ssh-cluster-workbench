appId: com.sshclusterworkbench.app
productName: SSH Cluster Workbench
copyright: Copyright © 2026 SSH Cluster Workbench contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
compression: maximum
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
